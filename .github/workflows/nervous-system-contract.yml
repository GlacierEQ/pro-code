name: Nervous System Contract
on:
  push:
    branches: [main]
    paths: [README.md, .glaciereq/nervous-system.node.json, .glaciereq/computer-kernel.live-receipt.json, docs/COMPUTER_EXECUTION_KERNEL.md, scripts/validate_nervous_system.py, .github/workflows/nervous-system-contract.yml]
  pull_request:
    paths: [README.md, .glaciereq/nervous-system.node.json, .glaciereq/computer-kernel.live-receipt.json, docs/COMPUTER_EXECUTION_KERNEL.md, scripts/validate_nervous_system.py, .github/workflows/nervous-system-contract.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/validate_nervous_system.py
