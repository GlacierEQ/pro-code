name: Pro-Code native verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript build and behavior
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Execute Vitest suite
        run: npm test -- --reporter=verbose

      - name: Build production bundle
        run: npm run build

      - name: Evaluate live harness recovery ablation
        run: npm run eval:harness -- --out .pro-code/runtime/harness-evaluation.json

      - name: Preserve source-bound evaluation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harness-evidence-${{ github.sha }}
          path: .pro-code/runtime/harness-evaluation.json
          if-no-files-found: warn
          retention-days: 90

  native-contracts:
    name: Python, Rust, and Haskell contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Set up Haskell
        uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        with:
          ghc-version: "9.6"

      - name: Execute Python contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Execute native Rust governor tests
        run: |
          rustc --edition 2021 --test src/governor.rs -o /tmp/pro-code-governor-tests
          /tmp/pro-code-governor-tests

      - name: Execute native Haskell AST invariants
        run: |
          ghc -Wall -Werror -isrc tests/ASTValidatorSpec.hs -o /tmp/pro-code-ast-tests
          /tmp/pro-code-ast-tests
