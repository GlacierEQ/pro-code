# Spiral Engine — Go CI (Self-Hosted)
# Uses public-actions-runner-host reusable workflow
# Zero GitHub minutes consumed
name: Go CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: GlacierEQ/public-actions-runner-host/.github/workflows/reusable-quick-ci.yml@main
    with:
      repo_name: ${{ github.event.repository.name }}
      language: go
