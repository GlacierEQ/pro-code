# ═══════════════════════════════════════════════════════════════
# GlacierEQ APEX — Full CI Template for Private Repos
# ═══════════════════════════════════════════════════════════════
# Copy this file to: .github/workflows/ci.yml in your private repo
# Includes: lint, test, security scan, optional build, optional deploy
# ═══════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force deploy"
        type: boolean
        default: false

jobs:
  ci:
    uses: GlacierEQ/public-actions-runner-host/.github/workflows/reusable-ci.yml@main
    with:
      repo_name: ${{ github.event.repository.name }}
      language: python          # python | typescript | javascript
      run_tests: true
      run_lint: true
      run_security: true
      run_build: false          # Enable for buildable repos
      deploy: false             # Enable for deployable repos
    secrets: inherit
